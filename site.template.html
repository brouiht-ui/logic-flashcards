<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logic Flashcards</title>
<meta name="description" content="Flashcards, a learn mode and a practice test for arguments, logic and fallacies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Course-reader look: paper, ink, index cards. One accent (ink blue); green/red only for right/wrong. */
:root {
  --paper: #f4f1ea; --card: #fffdf8; --ink: #1c1b18; --ink-2: #4a4740; --muted: #7a766c; --rule: #ddd7ca; --rule-2: #c9c2b2;
  --accent: #23407a; --accent-ink: #fffdf8; --accent-soft: #e6eaf2;
  --good: #2f6b3f; --good-soft: #e5efe4; --bad: #a3322a; --bad-soft: #f5e3df;
  --margin: #d9a3a0;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --shadow: 0 1px 0 rgba(28,27,24,.04), 0 6px 18px -8px rgba(28,27,24,.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #171613; --card: #201f1b; --ink: #ece7dc; --ink-2: #c4beb1; --muted: #8f897c; --rule: #33302a; --rule-2: #45413a;
    --accent: #9db4e3; --accent-ink: #171613; --accent-soft: #252b38;
    --good: #8cc59a; --good-soft: #1f2a21; --bad: #e59286; --bad-soft: #2f1f1c;
    --margin: #6b3c3a;
    --shadow: 0 1px 0 rgba(0,0,0,.2), 0 8px 20px -10px rgba(0,0,0,.6);
  }
}
* { box-sizing: border-box; border-radius: 0; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 72px; }

/* masthead */
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--ink); }
.eyebrow { font: 500 11.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
h1 { font: 500 clamp(28px, 5vw, 38px)/1.08 var(--serif); letter-spacing: -.012em; margin: 0; }
.sub { color: var(--muted); font-size: 14px; }
.mute { display: inline-flex; align-items: center; gap: 7px; background: none; border: 1px solid var(--rule-2); padding: 6px 10px; font: 500 12px/1 var(--mono); letter-spacing: .04em; color: var(--ink-2); white-space: nowrap; }
.mute:hover { border-color: var(--ink-2); }
.mute svg { width: 15px; height: 15px; }
.mute[aria-pressed="true"] { color: var(--bad); border-color: var(--bad); }

nav.tabs { display: flex; gap: 26px; margin: 0 0 22px; border-bottom: 1px solid var(--rule); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
nav.tabs button { background: none; border: 0; padding: 14px 0 12px; font-weight: 500; font-size: 15px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

/* set picker */
.sets { display: flex; flex-wrap: wrap; margin-bottom: 26px; border: 1px solid var(--rule-2); width: fit-content; max-width: 100%; }
.chip { display: flex; align-items: baseline; gap: 8px; border: 0; border-right: 1px solid var(--rule-2); background: var(--card); padding: 8px 14px; font-size: 13.5px; color: var(--ink-2); }
.chip:last-child { border-right: 0; }
.chip b { font: 500 12px var(--mono); color: var(--muted); }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.chip[aria-pressed="true"] b { color: inherit; opacity: .7; }

/* progress */
.meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font: 400 12.5px var(--mono); letter-spacing: .03em; color: var(--muted); }
.score .g { color: var(--good); } .score .b { color: var(--bad); }
.bar { height: 2px; background: var(--rule); margin: 10px 0 22px; }
.bar > i { display: block; height: 100%; background: var(--ink); width: 0; transition: width .3s ease; }

/* index card */
.scene { perspective: 1600px; margin-bottom: 18px; }
.card { position: relative; width: 100%; min-height: 360px; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,.7,.2,1); cursor: pointer; }
.card.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--card); border: 1px solid var(--rule-2); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: auto; }
.face.back { transform: rotateY(180deg); }
.cardhead { display: flex; justify-content: space-between; gap: 12px; padding: 14px 22px 10px; border-bottom: 1.5px solid var(--margin); font: 500 11.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.cardhead b { color: var(--ink); font-weight: 500; }
.face .q { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 26px 36px; font: 400 23px/1.45 var(--serif); }
.face .q b { font-weight: 600; }
.face .hint { text-align: center; color: var(--muted); font: 400 12px var(--mono); letter-spacing: .04em; padding: 0 0 16px; }
.face .ans { padding: 22px 28px 26px; }
.face h2 { font: 500 27px/1.2 var(--serif); margin: 0 0 12px; letter-spacing: -.01em; }
.face .a { font-size: 16px; line-height: 1.65; color: var(--ink-2); }
.face .a b { color: var(--ink); font-weight: 600; }

/* buttons */
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid var(--rule-2); background: var(--card); padding: 13px 16px; font-weight: 500; font-size: 15px; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.good:hover { border-color: var(--good); color: var(--good); }
.btn.bad:hover { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.btn kbd { opacity: .75; }
.keys { text-align: center; color: var(--muted); font: 400 12px var(--mono); margin-top: 14px; }
kbd { display: inline-block; min-width: 1.6em; border: 1px solid var(--rule-2); border-bottom-width: 2px; padding: 0 5px; font: 500 11px/1.6 var(--mono); color: inherit; text-align: center; }

/* exam question */
.prompt { margin-bottom: 18px; }
.prompt .label { font: 500 11.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.prompt .body { font: 400 22px/1.5 var(--serif); }
.prompt .body b { font-weight: 600; }
.opts { display: flex; flex-direction: column; border: 1px solid var(--rule-2); background: var(--card); }
.opt { display: flex; gap: 14px; align-items: center; text-align: left; border: 0; border-bottom: 1px solid var(--rule); background: none; padding: 14px 16px; font-size: 16px; }
.opt:last-child { border-bottom: 0; }
.opt .n { font: 500 12px var(--mono); color: var(--muted); border: 1px solid var(--rule-2); width: 24px; height: 24px; display: grid; place-items: center; flex: none; }
.opt .mark { margin-left: auto; font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.opt:hover:not(:disabled) { background: var(--accent-soft); }
.opt:hover:not(:disabled) .n { border-color: var(--accent); color: var(--accent); }
.opt.right { background: var(--good-soft); box-shadow: inset 3px 0 0 var(--good); }
.opt.right .n, .opt.right .mark { color: var(--good); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); box-shadow: inset 3px 0 0 var(--bad); }
.opt.wrong .n, .opt.wrong .mark { color: var(--bad); border-color: var(--bad); }
.opt:disabled { cursor: default; color: var(--ink); }
.feedback { margin: 18px 0; padding: 2px 0 2px 16px; border-left: 2px solid var(--good); color: var(--ink-2); font-size: 15px; }
.feedback.no { border-left-color: var(--bad); }
.feedback b { display: block; font: 500 18px/1.35 var(--serif); color: var(--ink); margin-bottom: 4px; }

/* results */
.results { background: var(--card); border: 1px solid var(--rule-2); box-shadow: var(--shadow); padding: 32px 28px; }
.results .eyebrow { margin-bottom: 14px; }
.big { font: 400 72px/1 var(--serif); letter-spacing: -.02em; margin: 0 0 6px; }
.results .line { color: var(--ink-2); }
.missed { margin: 24px 0; padding: 0; list-style: none; border-top: 1px solid var(--rule); }
.missed li { border-bottom: 1px solid var(--rule); padding: 12px 0; }
.missed li b { font: 500 17px var(--serif); }
.missed li span { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }

/* study plan */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--rule-2); background: var(--card); margin-bottom: 26px; }
.stat { padding: 16px 18px; border-right: 1px solid var(--rule); }
.stat:last-child { border-right: 0; }
.stat span { display: block; font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.stat b { font: 400 30px/1 var(--serif); }
.weak { font-size: 15px; color: var(--ink-2); margin: -8px 0 24px; }
.weak b { color: var(--ink); font-weight: 600; }
h3 { font: 500 11.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--rule-2); }
th, td { padding: 11px 14px; border-bottom: 1px solid var(--rule); text-align: left; font-size: 15px; }
th { font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
td:first-child { font: 500 14px var(--mono); color: var(--muted); width: 3.5em; }
td input { width: 18px; height: 18px; accent-color: var(--ink); vertical-align: middle; }
tr.done td:nth-child(2) { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--rule-2); }
.tips { color: var(--ink-2); font-size: 14.5px; padding-left: 18px; margin: 26px 0 18px; }
.tips li { margin-bottom: 6px; }
.link { background: none; border: 0; color: var(--accent); font-weight: 500; padding: 0; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.link.quiet { color: var(--muted); }

/* reward / punishment plate */
.reward { position: relative; background: var(--card); border: 1px solid var(--rule-2); box-shadow: var(--shadow); margin-bottom: 22px; }
.reward[hidden], .reward [hidden] { display: none; }
.plate-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--rule); font: 500 11.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.reward .streak { color: var(--ink); }
.reward .streak.pop { animation: pop .45s ease-out; display: inline-block; }
.reward .x { width: 28px; height: 28px; border: 1px solid transparent; background: none; font-size: 18px; line-height: 1; color: var(--muted); }
.reward .x:hover { border-color: var(--rule-2); color: var(--ink); }
.plate-body { padding: 14px; text-align: center; overflow: hidden; }
.reward img, .reward video { display: block; max-width: 100%; max-height: 320px; margin: 0 auto; }
.reward video { max-height: 380px; background: #000; }
.reward .loading { padding: 48px 0; color: var(--muted); font: 400 13px var(--mono); }
.reward[data-kind="punish"] { border-color: var(--bad); }
.reward[data-kind="punish"] .plate-head { background: var(--bad-soft); border-bottom-color: var(--bad); }
.reward[data-kind="punish"] .streak { color: var(--bad); }
.reward img.spin, .reward video.spin { animation: spinIn .85s cubic-bezier(.2,.9,.3,1.15) both; }
.reward img.slam, .reward video.slam { animation: slamIn .6s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes spinIn { 0% { transform: scale(0) rotate(-540deg); opacity: 0; } 70% { transform: scale(1.04) rotate(6deg); opacity: 1; } 100% { transform: none; } }
@keyframes slamIn { 0% { transform: scale(1.9) rotate(-6deg); opacity: 0; } 55% { transform: scale(.97) rotate(1deg); opacity: 1; } 70% { transform: translateX(-6px); } 85% { transform: translateX(6px); } 100% { transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
.confetti { position: fixed; top: 0; left: 0; width: 7px; height: 12px; pointer-events: none; z-index: 50; will-change: transform; }
.shake { animation: shake .32s; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
@media (prefers-reduced-motion: reduce) { .reward img.spin, .reward video.spin, .reward img.slam, .reward video.slam, .shake, .reward .streak.pop { animation: none; } .card { transition: none; } }

@media (max-width: 640px) {
  .wrap { padding: 22px 16px 56px; }
  header { align-items: flex-start; flex-direction: column; gap: 12px; }
  nav.tabs { gap: 20px; }
  .chip span { display: none; }
  .sets { width: 100%; } .chip { flex: 1; justify-content: center; }
  .card { min-height: 400px; }
  .face .q { font-size: 20px; padding: 20px 20px; }
  .face .ans { padding: 18px 18px 22px; }
  .face h2 { font-size: 23px; }
  .prompt .body { font-size: 19px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .stat:nth-child(2) { border-right: 0; }
  .stat:nth-child(-n+2) { border-bottom: 1px solid var(--rule); }
  .big { font-size: 60px; }
  th:nth-child(3), td:nth-child(3) { display: none; }
  .keys { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Critical reasoning &middot; 24 cards &middot; 4 sets</p>
      <h1>Arguments, Logic &amp; Fallacies</h1>
    </div>
    <button class="mute" id="mute" type="button"></button>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="cards" aria-selected="true">Flashcards</button>
    <button role="tab" data-tab="learn" aria-selected="false">Learn</button>
    <button role="tab" data-tab="test" aria-selected="false">Practice test</button>
    <button role="tab" data-tab="plan" aria-selected="false">Study plan</button>
  </nav>
  <div class="sets" id="sets"></div>
  <aside class="reward" id="reward" hidden aria-live="polite">
    <div class="plate-head">
      <span class="streak" id="streak"></span>
      <button class="x" id="rewardClose" type="button" aria-label="Hide">&times;</button>
    </div>
    <div class="plate-body">
      <img id="rewardImg" alt="">
      <video id="rewardVid" playsinline loop controls hidden></video>
      <div class="loading" id="rewardLoading" hidden>Loading video&hellip;</div>
    </div>
  </aside>
  <main id="view"></main>
</div>

<script>
const DATA = __DATA__;

// Practice test: hand-written options so the distractors are real alternatives
const TEST = [
  ["\"My uncle smoked all his life and lived to 95, so smoking can't be that bad.\"", "Hasty generalization", ["Appeal to ignorance", "Slippery slope", "False analogy"]],
  ["\"You can't trust his argument about climate policy; he drives an SUV.\"", "Ad hominem", ["Straw man", "Appeal to authority", "Begging the question"]],
  ["\"Nobody has shown this supplement is harmful, so it's safe.\"", "Appeal to ignorance", ["Naturalistic fallacy", "Hasty generalization", "Appeal to authority"]],
  ["\"We either ban phones in class entirely or accept that no one will learn.\"", "False dichotomy", ["Slippery slope", "Straw man", "Begging the question"]],
  ["\"Free will exists, because we are free to choose what we do.\"", "Begging the question", ["Appeal to ignorance", "False dichotomy", "Naturalistic fallacy"]],
  ["Feminists want equal pay. A critic replies: \"They want to make men second-class citizens.\"", "Straw man", ["Ad hominem", "Slippery slope", "False analogy"]],
  ["\"If we allow food in the library, next it'll be parties, and then the place will be trashed.\"", "Slippery slope", ["False dichotomy", "Hasty generalization", "Straw man"]],
  ["\"A Nobel-winning physicist says this vaccine is unsafe, so it is.\"", "Appeal to authority", ["Ad hominem", "Appeal to ignorance", "Confirmation bias"]],
  ["\"The universe is like a watch. Watches have makers, so the universe does too.\"", "False analogy", ["Begging the question", "Hasty generalization", "Naturalistic fallacy"]],
  ["\"Animals eat meat in nature, so eating meat must be morally right.\"", "Naturalistic fallacy", ["False analogy", "Appeal to ignorance", "Hasty generalization"]],
  ["All birds can fly. Penguins are birds. So penguins can fly.", "Valid but not sound", ["Valid and sound", "Invalid but sound", "Invalid and unsound"]],
  ["If it rains, the ground is wet. The ground is wet. So it rained.", "Invalid: affirming the consequent", ["Valid and sound", "Valid but not sound", "Invalid: denying the antecedent"]],
];
const EXPLAIN = {
  11: "The form is valid (if the premises were true, the conclusion would have to be), but \"All birds can fly\" is false, so it is not sound.",
  12: "The ground could be wet for another reason (a sprinkler). Reasoning from Q back to P is the formal fallacy of affirming the consequent.",
};

const SCHEDULE = [
  [1, "Learn Set A", "A"], [2, "Learn Set B, review Set A", "AB"], [3, "Learn Set C, review Set B", "BC"],
  [4, "Learn Set D, review Sets A and C", "ACD"], [5, "Review Sets B and D", "BD"], [6, "Review Set C", "C"],
  [7, "Review Set D", "D"], [8, "Review Set A", "A"], [9, "Review Set B", "B"], [10, "Review Set C", "C"],
  [11, "Review Set D", "D"], [15, "Final review: Set A", "A"], [16, "Final review: Set B", "B"],
  [17, "Final review: Set C", "C"], [18, "Final review: Set D", "D"],
];

// ---- storage (per-viewer; page works without it) ----
const store = {
  get(k, d) { try { const v = localStorage.getItem("logic:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("logic:" + k, JSON.stringify(v)); } catch {} },
};

const NAME_RE = /^(<b>)?Name the (<b>)?(fallacy|bias|effect)(<\/b>)?[.:]?(<\/b>)?\s*(<br\/>)*/;
const cards = DATA.cards.map((c, i) => ({ ...c, id: i + 1, isName: NAME_RE.test(c.q) }));
const plain = h => { const d = document.createElement("div"); d.innerHTML = h; return d.textContent.trim(); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const $ = s => document.querySelector(s);
const view = $("#view");

let tab = store.get("tab", "cards");
let picked = new Set(store.get("sets", ["A", "B", "C", "D"]));
let session = null;
let stats = store.get("stats", {}); // id -> {r, w}

function record(id, ok) {
  const s = stats[id] || { r: 0, w: 0 };
  ok ? s.r++ : s.w++;
  stats[id] = s;
  store.set("stats", stats);
}

// ---- set chips ----
function renderSets() {
  const el = $("#sets");
  el.style.display = tab === "cards" || tab === "learn" ? "" : "none";
  el.innerHTML = "ABCD".split("").map(s =>
    `<button class="chip" data-set="${s}" aria-pressed="${picked.has(s) && picked.size < 4}" title="Set ${s}: ${DATA.sets[s]}"><b>${s}</b><span>${DATA.sets[s].split(/[,&]/)[0].trim()}</span></button>`
  ).join("") + `<button class="chip" data-set="all" aria-pressed="${picked.size === 4}">All</button>`;
}
$("#sets").addEventListener("click", e => {
  const b = e.target.closest("[data-set]"); if (!b) return;
  const s = b.dataset.set;
  // with everything selected, clicking a set studies just that set
  if (s === "all") picked = new Set("ABCD");
  else if (picked.size === 4) picked = new Set(s);
  else if (picked.has(s) && picked.size > 1) picked.delete(s);
  else picked.add(s);
  store.set("sets", [...picked]);
  start();
});

// ---- tabs ----
document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  tab = b.dataset.tab; store.set("tab", tab); start();
});
function renderTabs() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
}

function start(deck) {
  renderTabs(); renderSets();
  const pool = deck || shuffle(cards.filter(c => picked.has(c.set)));
  if (tab === "cards") session = { mode: "cards", deck: pool, i: 0, flipped: false, right: [], wrong: [] };
  if (tab === "learn") session = { mode: "learn", deck: pool.map(makeQuestion), i: 0, answered: null, right: [], wrong: [] };
  if (tab === "test") session = { mode: "test", deck: shuffle(TEST.map((t, i) => ({ n: i + 1, prompt: t[0], answer: t[1], opts: shuffle([t[1], ...t[2]]) }))), i: 0, answered: null, right: [], wrong: [] };
  if (tab === "plan") session = { mode: "plan" };
  render();
}

function makeQuestion(c) {
  // "Name the fallacy" cards ask from the scenario; concept cards ask from the definition
  const group = cards.filter(x => x.isName === c.isName && x.id !== c.id);
  const opts = shuffle([c.title, ...shuffle(group).slice(0, 3).map(x => x.title)]);
  return c.isName
    ? { card: c, label: "Which fallacy, bias or effect is this?", prompt: c.q.replace(NAME_RE, ""), answer: c.title, opts }
    : { card: c, label: "Which concept does this describe?", prompt: c.a.replace(/<i>Check this[^<]*<\/i>/, ""), answer: c.title, opts };
}

function header(total) {
  const s = session, done = s.right.length + s.wrong.length;
  const unit = s.mode === "cards" ? "Card" : "Question";
  return `<div class="meta"><span>${unit} ${Math.min(s.i + 1, total)} of ${total}</span>
    <span class="score"><span class="g">${s.right.length} correct</span> &nbsp;&middot;&nbsp; <span class="b">${s.wrong.length} missed</span></span></div>
    <div class="bar"><i style="width:${(done / total) * 100}%"></i></div>`;
}

function render() {
  const s = session;
  if (s.mode === "plan") return renderPlan();
  const total = s.deck.length;
  if (s.i >= total) return renderResults();
  if (s.mode === "cards") return renderCard(total);
  return renderChoice(total);
}

function renderCard(total) {
  const s = session, c = s.deck[s.i];
  view.innerHTML = header(total) + `
    <div class="scene"><div class="card ${s.flipped ? "flipped" : ""}" id="card" tabindex="0" aria-label="Flashcard, click to flip">
      <div class="face front">
        <div class="cardhead"><span><b>${c.set}&middot;${String(c.id).padStart(2, "0")}</b></span><span>${DATA.sets[c.set]}</span></div>
        <div class="q"><div>${c.q}</div></div>
        <div class="hint">Answer it out loud, then flip</div>
      </div>
      <div class="face back">
        <div class="cardhead"><span><b>${c.set}&middot;${String(c.id).padStart(2, "0")}</b></span><span>Answer</span></div>
        <div class="ans"><h2>${c.title}</h2><div class="a">${c.a}</div></div>
      </div>
    </div></div>
    <div class="row" id="grade">
      ${s.flipped
        ? `<button class="btn bad" data-g="0">Missed it <kbd>1</kbd></button><button class="btn primary" data-g="1">Got it <kbd>2</kbd></button>`
        : `<button class="btn primary" data-flip>Flip card <kbd>Space</kbd></button>`}
    </div>
`;
  $("#card").onclick = flip;
  $("#grade").onclick = e => {
    if (e.target.closest("[data-flip]")) flip();
    const g = e.target.closest("[data-g]"); if (g) grade(g.dataset.g === "1");
  };
}
function flip() { session.flipped = !session.flipped; $("#card").classList.toggle("flipped", session.flipped); if (session.flipped) renderCardButtons(); }
function renderCardButtons() {
  $("#grade").innerHTML = `<button class="btn bad" data-g="0">Missed it <kbd>1</kbd></button><button class="btn primary" data-g="1">Got it <kbd>2</kbd></button>`;
}
function grade(ok) {
  const s = session, c = s.deck[s.i];
  (ok ? s.right : s.wrong).push(c);
  record(c.id, ok);
  s.i++; s.flipped = false; render();
  ok ? celebrate() : miss();
}
function renderChoice(total) {
  const s = session, q = s.deck[s.i], a = s.answered;
  const isTest = s.mode === "test";
  view.innerHTML = header(total) + `
    <div class="prompt">
      <div class="label">${isTest ? (q.n > 10 ? "Judge the argument" : "Name the fallacy") : q.label}</div>
      <div class="body">${q.prompt}</div>
    </div>
    <div class="opts" id="opts">${q.opts.map((o, k) => {
      let cls = "";
      if (a) { if (o === q.answer) cls = "right"; else if (o === a) cls = "wrong"; }
      const mark = cls === "right" ? (o === a ? "Correct" : "Answer") : cls === "wrong" ? "Your pick" : "";
      return `<button class="opt ${cls}" data-o="${k}" ${a ? "disabled" : ""}><span class="n">${k + 1}</span><span>${o}</span>${mark ? `<span class="mark">${mark}</span>` : ""}</button>`;
    }).join("")}</div>
    ${a ? feedback(q, a) + `<button class="btn primary" style="width:100%" id="next">${s.i + 1 < total ? "Next question" : "See results"} <kbd>Enter</kbd></button>` : ""}
    <div class="keys">${a ? "<kbd>Enter</kbd> next question" : "<kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> to answer"}</div>`;
  $("#opts").onclick = e => { const b = e.target.closest("[data-o]"); if (b && !a) choose(q.opts[+b.dataset.o]); };
  if (a) $("#next").onclick = next;
}
function feedback(q, a) {
  const ok = a === q.answer;
  let more = "";
  if (q.card) more = plain(q.card.a.replace(/<i>Check this[^<]*<\/i>/, "")).slice(0, 260);
  else if (EXPLAIN[q.n]) more = EXPLAIN[q.n];
  return `<div class="feedback ${ok ? "" : "no"}"><b>${ok ? "Correct." : `Not quite. It's ${q.answer}.`}</b>${more}</div>`;
}
function choose(o) {
  const s = session, q = s.deck[s.i];
  s.answered = o;
  const ok = o === q.answer;
  (ok ? s.right : s.wrong).push(q);
  if (q.card) record(q.card.id, ok);
  render();
  ok ? celebrate() : miss();
}
function next() { session.i++; session.answered = null; render(); }

function renderResults() {
  const s = session, total = s.deck.length, pct = Math.round((s.right.length / total) * 100);
  const name = x => x.title || x.answer;
  const prompt = x => x.q ? plain(x.q) : plain(x.prompt);
  if (s.mode === "test") { const best = store.get("bestTest", 0); if (pct > best) store.set("bestTest", pct); }
  view.innerHTML = `<div class="results">
    <p class="eyebrow">${s.mode === "test" ? "Practice test" : s.mode === "learn" ? "Learn round" : "Flashcard round"} &middot; complete</p>
    <div class="big" style="color:${pct >= 80 ? "var(--good)" : pct >= 50 ? "var(--ink)" : "var(--bad)"}">${pct}%</div>
    <div class="line">${s.right.length} of ${total} correct. ${pct === 100 ? "A clean round." : pct >= 80 ? "Strong &mdash; review the misses and go again." : "Retry the misses until they stick."}</div>
    ${s.wrong.length ? `<ul class="missed">${s.wrong.map(x => `<li><b>${name(x)}</b><span>${prompt(x).slice(0, 140)}</span></li>`).join("")}</ul>` : "<div style='height:24px'></div>"}
    <div class="row">
      ${s.wrong.length && s.mode !== "test" ? `<button class="btn" id="retry">Retry ${s.wrong.length} missed</button>` : ""}
      <button class="btn primary" id="again">Start over</button>
    </div></div>`;
  $("#again").onclick = () => start();
  const r = $("#retry");
  if (r) r.onclick = () => start(shuffle(s.wrong.map(x => x.card || x)));
}

function renderPlan() {
  const done = store.get("plan", {});
  const seen = Object.keys(stats).length;
  const tot = Object.values(stats).reduce((a, s) => [a[0] + s.r, a[1] + s.w], [0, 0]);
  const acc = tot[0] + tot[1] ? Math.round(tot[0] / (tot[0] + tot[1]) * 100) + "%" : "-";
  const weak = cards.filter(c => stats[c.id] && stats[c.id].w > 0).sort((a, b) => (stats[b.id].w - stats[b.id].r) - (stats[a.id].w - stats[a.id].r)).slice(0, 5);
  view.innerHTML = `
    <div class="stats">
      <div class="stat"><span>Studied</span><b>${seen}/24</b></div>
      <div class="stat"><span>Accuracy</span><b>${acc}</b></div>
      <div class="stat"><span>Days done</span><b>${Object.values(done).filter(Boolean).length}/15</b></div>
      <div class="stat"><span>Best test</span><b>${store.get("bestTest", 0)}%</b></div>
    </div>
    ${weak.length ? `<p class="weak"><b>Weakest:</b> ${weak.map(c => c.title).join(", ")}. <button class="link" id="drill">Drill these</button></p>` : ""}
    <h3>Review schedule</h3>
    <table><thead><tr><th>Day</th><th>Task</th><th>Cards</th><th>Done</th><th></th></tr></thead><tbody>
    ${SCHEDULE.map(([d, t, sets]) => `<tr class="${done[d] ? "done" : ""}"><td><b>${d}</b></td><td>${t}</td><td>${sets.length * 6}</td>
      <td><input type="checkbox" data-day="${d}" ${done[d] ? "checked" : ""} aria-label="Day ${d} done"></td>
      <td><button class="link" data-study="${sets}">Study</button></td></tr>`).join("")}
    </tbody></table>
    <ul class="tips">
      <li>Each set is reviewed 1, 3, 7 and 14 days after you learn it.</li>
      <li><b>Answer first.</b> Say your answer before flipping. Recalling is what builds memory.</li>
      <li><b>Missed cards restart.</b> If you get one wrong, treat it as new and restart its intervals.</li>
      <li>Most days are 6-12 cards (10-15 min). Day 4 is the heavy one at 18 cards.</li>
      <li>Check cards 15, 20 and 21 against your course materials.</li>
    </ul>
    <p><button class="link quiet" id="reset">Reset all progress</button></p>`;
  view.querySelectorAll("[data-day]").forEach(b => b.onchange = () => { done[b.dataset.day] = b.checked; store.set("plan", done); renderPlan(); });
  view.querySelectorAll("[data-study]").forEach(b => b.onclick = () => { picked = new Set(b.dataset.study); store.set("sets", [...picked]); tab = "cards"; store.set("tab", tab); start(); });
  const dr = $("#drill"); if (dr) dr.onclick = () => { tab = "learn"; start(shuffle(weak)); };
  $("#reset").onclick = () => { if (confirm("Clear your scores and ticked days?")) { stats = {}; store.set("stats", {}); store.set("plan", {}); store.set("bestTest", 0); renderPlan(); } };
}

document.addEventListener("keydown", e => {
  const s = session; if (!s || e.target.matches("input")) return;
  if (s.mode === "cards" && s.i < s.deck.length) {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
    else if (s.flipped && e.key === "1") grade(false);
    else if (s.flipped && e.key === "2") grade(true);
  } else if ((s.mode === "learn" || s.mode === "test") && s.i < s.deck.length) {
    const q = s.deck[s.i];
    if (!s.answered && /^[1-4]$/.test(e.key) && q.opts[+e.key - 1]) choose(q.opts[+e.key - 1]);
    else if (s.answered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); next(); }
  }
});

// ---- rewards (right answers) and punishments (wrong answers) ----
// rewards.json: { images: [...], punishments: [...] }; each entry is a picture path or { type: "video", id, mime, parts }.
// admin.html edits it.
let streak = 0, showing = 0;
const pools = {
  reward: { items: [], seenKey: "seenRewards", upcoming: null },
  punish: { items: [], seenKey: "seenPunish", upcoming: null },
};
const rewardKey = e => typeof e === "string" ? e : e.id;
const isVideo = e => e && typeof e === "object" && e.type === "video";
const validEntries = list => Array.isArray(list) ? list.filter(e => typeof e === "string" || (isVideo(e) && Array.isArray(e.parts))) : [];
fetch("rewards.json?v=" + Date.now()).then(r => r.ok ? r.json() : {})
  .then(d => {
    pools.reward.items = validEntries(d.images);
    pools.punish.items = validEntries(d.punishments);
    queueNext(pools.reward); queueNext(pools.punish);
  })
  .catch(() => {});

// Videos are stored in 4 MB pieces; fetch them all and join them into one playable file.
// Keeps the last few in memory so the queued-up next one is ready instantly.
const videoCache = new Map();
function loadVideo(e) {
  if (!videoCache.has(e.id)) {
    const p = Promise.all(e.parts.map(u => fetch(u).then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })))
      .then(blobs => URL.createObjectURL(new Blob(blobs, { type: e.mime || "video/mp4" })));
    p.catch(() => videoCache.delete(e.id));
    videoCache.set(e.id, p);
    while (videoCache.size > 4) {
      const [oldId, oldP] = videoCache.entries().next().value;
      videoCache.delete(oldId);
      oldP.then(url => { if ($("#rewardVid").src !== url) URL.revokeObjectURL(url); }).catch(() => {});
    }
  }
  return videoCache.get(e.id);
}
function preload(e) {
  if (!e) return;
  if (isVideo(e)) loadVideo(e).catch(() => {});
  else new Image().src = e;
}
function queueNext(pool) { pool.upcoming = pool.items.length ? nextFrom(pool) : null; preload(pool.upcoming); }

// Shuffle-deck order: everything in a pool shows once before any repeats, remembered across reloads.
// New uploads are unseen, so they come up within the current round.
function nextFrom(pool) {
  const keys = pool.items.map(rewardKey);
  const seen = store.get(pool.seenKey, []).filter(k => keys.includes(k));
  let choices = keys.filter(k => !seen.includes(k));
  if (!choices.length) {
    // new round: everything is back in, but don't open it with the one just shown
    const last = seen[seen.length - 1];
    seen.length = 0;
    choices = keys.length > 1 ? keys.filter(k => k !== last) : keys;
  }
  const pick = choices[Math.floor(Math.random() * choices.length)];
  seen.push(pick);
  store.set(pool.seenKey, seen);
  return pool.items[keys.indexOf(pick)];
}

// Shows the next reward or punishment in the panel; it stays (videos keep looping) until the next one replaces it.
async function showMedia(kind, label) {
  const pool = pools[kind];
  if (!pool.items.length) return;
  const keys = pool.items.map(rewardKey);
  const entry = pool.upcoming && keys.includes(rewardKey(pool.upcoming)) ? pool.upcoming : nextFrom(pool);
  queueNext(pool);
  const box = $("#reward"), img = $("#rewardImg"), vid = $("#rewardVid"), loading = $("#rewardLoading"), st = $("#streak");
  const ticket = ++showing; // whatever was answered last wins if an earlier one is still loading
  box.dataset.kind = kind;
  box.hidden = false;
  st.textContent = label;
  vid.pause();
  let el;
  if (isVideo(entry)) {
    img.hidden = true; vid.hidden = true; loading.hidden = false; loading.textContent = "Loading video\u2026";
    let url;
    try { url = await loadVideo(entry); } catch { if (ticket === showing) loading.textContent = "Couldn't load this video."; return; }
    if (ticket !== showing) return;
    loading.hidden = true; vid.hidden = false;
    vid.src = url;
    vid.muted = muted;
    vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); });
    el = vid;
  } else {
    vid.hidden = true; loading.hidden = true; img.hidden = false;
    vid.removeAttribute("src"); vid.load();
    img.src = entry;
    el = img;
  }
  el.classList.remove("spin", "slam");
  void el.offsetWidth; // restart the animation
  el.classList.add(kind === "punish" ? "slam" : "spin");
}

function celebrate() {
  streak++;
  sound(true);
  confetti();
  const st = $("#streak");
  const label = streak > 1 ? `Reward \u00b7 streak ${streak}` : "Reward";
  if (pools.reward.items.length) showMedia("reward", label);
  else if ($("#reward").dataset.kind !== "punish") st.textContent = label;
  st.classList.remove("pop"); void st.offsetWidth; st.classList.add("pop");
}
function miss() {
  streak = 0;
  sound(false);
  const el = $("#card") || $("#opts");
  if (el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  if (pools.punish.items.length) showMedia("punish", "Punishment");
  else if ($("#reward").dataset.kind !== "punish") $("#streak").textContent = "";
}
$("#rewardClose").onclick = () => { $("#reward").hidden = true; $("#rewardVid").pause(); };

let muted = store.get("muted", false), actx = null;
// Hard mute: silences effects and videos, and keeps videos silent even if their own volume control is used
function renderMute() {
  const b = $("#mute");
  b.innerHTML = muted
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>Muted`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/></svg>Sound on`;
  b.title = muted ? "Everything is muted, including videos. Click to turn sound on." : "Click to mute everything, including videos.";
  b.setAttribute("aria-pressed", muted);
}
$("#mute").onclick = () => {
  muted = !muted; store.set("muted", muted); renderMute();
  const vid = $("#rewardVid");
  vid.muted = muted;
  if (!muted && !vid.hidden && vid.paused && vid.src) vid.play().catch(() => {});
};
$("#rewardVid").addEventListener("volumechange", e => { if (muted && !e.target.muted) e.target.muted = true; });
renderMute();
function sound(ok) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    const notes = ok ? [523.25, 659.25, 783.99, 1046.5] : [196, 155.56];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = ok ? "triangle" : "sawtooth";
      o.frequency.value = f;
      const t = t0 + i * (ok ? 0.08 : 0.14), len = ok ? (i === notes.length - 1 ? 0.5 : 0.14) : 0.2;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(ok ? 0.25 : 0.12, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + len + 0.02);
    });
  } catch {}
}
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#23407a", "#2f6b3f", "#a3322a", "#c79a3b", "#1c1b18", "#d9a3a0"];
  const cx = innerWidth / 2, cy = innerHeight / 3;
  for (let i = 0; i < 70; i++) {
    const d = document.createElement("i");
    d.className = "confetti";
    d.style.background = colors[i % colors.length];
    document.body.appendChild(d);
    const ang = Math.random() * Math.PI * 2, v = 160 + Math.random() * 320;
    const dx = Math.cos(ang) * v, dy = Math.sin(ang) * v - 140;
    d.animate([
      { transform: `translate(${cx}px, ${cy}px) rotate(0deg)`, opacity: 1 },
      { transform: `translate(${cx + dx}px, ${cy + dy + 420}px) rotate(${Math.random() * 900 - 450}deg)`, opacity: 0 },
    ], { duration: 1100 + Math.random() * 700, easing: "cubic-bezier(.2,.6,.4,1)" }).onfinish = () => d.remove();
  }
}

start();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Media Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f1ea; --panel: #fffdf8; --ink: #1c1b18; --muted: #7a766c; --line: #c9c2b2; --rule: #ddd7ca;
  --accent: #1c1b18; --accent-ink: #fffdf8; --good: #2f6b3f; --bad: #a3322a; --soft: #e6eaf2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171613; --panel: #201f1b; --ink: #ece7dc; --muted: #8f897c; --line: #45413a; --rule: #33302a;
    --accent: #ece7dc; --accent-ink: #171613; --good: #8cc59a; --bad: #e59286; --soft: #252b38;
  }
}
* { box-sizing: border-box; border-radius: 0; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 "IBM Plex Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
.wrap { max-width: 860px; --mono: "IBM Plex Mono", ui-monospace, monospace; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font: 500 32px/1.1 "Newsreader", Georgia, serif; margin: 0 0 8px; padding-top: 12px; }
.sub { color: var(--muted); font-size: 14.5px; margin: 0 0 22px; padding-bottom: 18px; border-bottom: 1px solid var(--ink); }
.box { background: var(--panel); border: 1px solid var(--line); padding: 16px; margin-bottom: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
input[type=password] { flex: 1; min-width: 200px; padding: 10px 12px; border: 1px solid var(--line); background: var(--bg); }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 10px 14px; font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.bad { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.drop { display: block; border: 1.5px dashed var(--line); padding: 34px 16px; text-align: center; color: var(--muted); cursor: pointer; background: var(--panel); margin-bottom: 16px; }
.drop.over { border-color: var(--accent); background: var(--soft); color: var(--accent); }
.drop b { display: block; font: 500 20px "Newsreader", Georgia, serif; color: var(--ink); margin-bottom: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--rule); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.tile img { width: 100%; height: 150px; object-fit: cover; background: var(--bg); }
.tile span { font: 11.5px var(--mono); color: var(--muted); word-break: break-all; }
.bucket { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 16px; border: 1px solid var(--line); }
.bucket button { border: 0; border-right: 1px solid var(--line); font-size: 15px; background: var(--panel); padding: 12px; font-weight: 700; cursor: pointer; }
.bucket button small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.bucket button.on { background: var(--accent); color: var(--accent-ink); }
.bucket button.on small { color: inherit; opacity: .8; }
body.punish .bucket button.on, body.punish .btn.primary { background: var(--bad); border-color: var(--bad); color: #fff; }
.prog { height: 8px; background: var(--line); margin: -6px 0 14px; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.vid { width: 100%; height: 150px; background: #1c1b18; color: #ece7dc; font: 500 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 700; }
.vid small { font-weight: 400; opacity: .7; }
.status { min-height: 1.5em; font-size: 14px; margin: 8px 0 14px; }
.status.err { color: var(--bad); } .status.ok { color: var(--good); }
.help { font-size: 14px; color: var(--muted); }
.help ol { padding-left: 20px; margin: 6px 0; }
a { color: var(--accent); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Media library</h1>
  <p class="sub">Rewards show when someone gets a question right; punishments show when they get one wrong. Changes go live on the site a minute or two after you save. <a href="./">Back to the site</a></p>

  <section class="box" id="login">
    <b>Admin password</b>
    <div class="row" style="margin-top:8px">
      <input type="password" id="token" placeholder="Password" autocomplete="current-password">
      <button class="btn primary" id="saveToken">Unlock</button>
    </div>
    <label class="help" style="display:block;margin-top:8px"><input type="checkbox" id="remember"> Remember on this device</label>
  </section>

  <div id="panel" hidden>
    <div class="bucket" id="bucket">
      <button class="on" data-b="rewards">Rewards <small>Shown on right answers</small></button>
      <button data-b="punishments">Punishments <small>Shown on wrong answers</small></button>
    </div>
    <label class="drop" id="drop">
      <b>Drop pictures or videos here</b>
      or click to choose files (JPG, PNG, GIF, WebP, MP4, WebM, MOV &middot; videos up to 150 MB)
      <input type="file" id="file" accept="image/*,video/*" multiple hidden>
    </label>
    <div class="status" id="status"></div>
    <div class="prog" id="prog" hidden><i></i></div>
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
      <b id="count">Rewards</b>
      <button class="btn" id="logout">Lock</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
const FN = "/.netlify/functions/rewards";
const $ = s => document.querySelector(s);

const pwStore = {
  get() { try { return localStorage.getItem("logic:adminpw") || sessionStorage.getItem("logic:adminpw") || ""; } catch { return ""; } },
  set(v, remember) {
    try {
      localStorage.removeItem("logic:adminpw"); sessionStorage.removeItem("logic:adminpw");
      if (v) (remember ? localStorage : sessionStorage).setItem("logic:adminpw", v);
    } catch {}
  },
};
let password = pwStore.get();
let images = [], bucket = "rewards";
const bucketName = () => bucket === "punishments" ? "punishment" : "reward";

function status(msg, kind = "") { const el = $("#status"); el.textContent = msg; el.className = "status " + kind; }

async function call(action, extra = {}) {
  let res;
  try {
    res = await fetch(FN, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password, action, bucket, ...extra }) });
  } catch { throw new Error("Couldn't reach the server. Check your connection."); }
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 404 && !data.error) throw new Error("The admin server isn't set up on this site. It only works on the Netlify site connected to GitHub.");
  if (!res.ok) { const e = new Error(data.error || `Server error ${res.status}`); e.status = res.status; throw e; }
  return data;
}

const mb = n => (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + " MB";

function renderGrid() {
  const n = images.length;
  $("#count").textContent = n ? `${n} ${bucketName()}${n === 1 ? "" : "s"}` : `No ${bucketName()}s yet. Drop some pictures or videos above.`;
  $("#grid").innerHTML = images.map((im, i) => `
    <div class="tile">
      ${im.type === "video"
        ? `<div class="vid">Video<small>${im.size ? mb(im.size) : `${im.parts} piece${im.parts === 1 ? "" : "s"}`}</small></div>`
        : `<img src="${im.url}?t=${Date.now()}" alt="" loading="lazy">`}
      <span>${im.id.replace(/</g, "&lt;")}</span>
      <button class="btn bad" data-del="${i}">Remove</button>
    </div>`).join("");
}

async function refresh() { images = (await call("list")).images; renderGrid(); }

async function unlock() {
  $("#saveToken").disabled = true;
  try {
    await refresh();
    $("#login").hidden = true; $("#panel").hidden = false; status("");
  } catch (e) {
    if (e.status === 401) { password = ""; pwStore.set(""); }
    $("#login").hidden = false; $("#panel").hidden = true;
    alert(e.message);
  } finally { $("#saveToken").disabled = false; }
}

// Netlify caps a request at ~6 MB, so everything goes up in 4 MB pieces (about 5.4 MB once encoded)
const PIECE = 4 * 1024 * 1024, MAX_VIDEO = 150 * 1024 * 1024;
const fileB64 = blob => new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = () => bad(r.error); r.readAsDataURL(blob); });

// Big photos are shrunk to 1600px JPEG so they load fast; GIFs are kept as-is to keep the animation
async function preparePicture(file) {
  if (file.type === "image/gif") {
    if (file.size > PIECE) throw new Error(`${file.name} is too big. GIFs need to be under 4 MB.`);
    return { name: file.name, blob: file };
  }
  const img = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
  if (scale === 1 && file.size < 1.5 * 1024 * 1024) return { name: file.name, blob: file };
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.88));
  return { name: file.name.replace(/\.[^.]+$/, "") + ".jpg", blob };
}

function progress(frac) {
  const el = $("#prog");
  el.hidden = frac == null;
  el.firstElementChild.style.width = ((frac || 0) * 100).toFixed(1) + "%";
}

let busy = false;
async function upload(files) {
  files = [...files].filter(f => f.type.startsWith("image/") || f.type.startsWith("video/"));
  if (!files.length || busy) return;
  const big = files.find(f => f.type.startsWith("video/") && f.size > MAX_VIDEO);
  if (big) return status(`${big.name} is ${mb(big.size)}. Videos need to be under 150 MB.`, "err");
  busy = true;
  try {
    for (let i = 0; i < files.length; i++) {
      const f = files[i], isVideo = f.type.startsWith("video/");
      const label = `${files.length > 1 ? `${i + 1} of ${files.length}: ` : ""}${f.name}`;
      const { name, blob } = isVideo ? { name: f.name, blob: f } : await preparePicture(f);
      const count = Math.max(1, Math.ceil(blob.size / PIECE));
      const shas = [];
      for (let k = 0; k < count; k++) {
        status(`Uploading ${label}${count > 1 ? ` (${Math.round((k / count) * 100)}%)` : ""}...`);
        progress((i + k / count) / files.length);
        const data = await fileB64(blob.slice(k * PIECE, (k + 1) * PIECE));
        shas.push((await call("blob", { data })).sha);
      }
      status(`Saving ${label}...`);
      await call("commit", { kind: isVideo ? "video" : "image", name, mime: f.type, size: blob.size, shas });
    }
    progress(1);
    await refresh();
    status(`Added ${files.length}. Live on the site in a minute or two.`, "ok");
  } catch (e) {
    status(e.message, "err");
  } finally { busy = false; setTimeout(() => progress(null), 800); }
}

async function remove(i) {
  if (busy) return;
  const id = images[i].id;
  if (!confirm(`Remove ${id} from the ${bucketName()}s?`)) return;
  busy = true;
  try {
    status(`Removing ${id}...`);
    await call("remove", { id });
    await refresh();
    status("Removed. The site updates in a minute or two.", "ok");
  } catch (e) {
    status(e.message, "err");
  } finally { busy = false; }
}

$("#bucket").onclick = async e => {
  const b = e.target.closest("[data-b]");
  if (!b || busy || b.dataset.b === bucket) return;
  bucket = b.dataset.b;
  document.querySelectorAll("#bucket button").forEach(x => x.classList.toggle("on", x === b));
  document.body.classList.toggle("punish", bucket === "punishments");
  $("#drop b").textContent = bucket === "punishments" ? "Drop punishment pictures or videos here" : "Drop pictures or videos here";
  images = []; renderGrid(); status("Loading...");
  try { await refresh(); status(""); } catch (err) { status(err.message, "err"); }
};
$("#saveToken").onclick = () => { password = $("#token").value; if (!password) return; pwStore.set(password, $("#remember").checked); $("#token").value = ""; unlock(); };
$("#token").onkeydown = e => { if (e.key === "Enter") $("#saveToken").click(); };
$("#logout").onclick = () => { password = ""; pwStore.set(""); $("#panel").hidden = true; $("#login").hidden = false; };
$("#grid").onclick = e => { const b = e.target.closest("[data-del]"); if (b) remove(+b.dataset.del); };
$("#file").onchange = e => { upload(e.target.files); e.target.value = ""; };
const drop = $("#drop");
["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => upload(e.dataTransfer.files));
// dropping a file anywhere else on the page shouldn't navigate away
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => e.preventDefault());

if (password) unlock();
</script>
</body>
</html>
